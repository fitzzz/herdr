# Exact Arch Linux packages for the herdr-fast-api build service container. Each line is
# `name version arch`; the build service installs each from
# https://archive.archlinux.org/packages with `pacman -U`.
#
# Contents: every package of the pinned archlinux base image (`pacman -Q` inside
# archlinux@sha256:4e77cf2e...5dbd) plus the dependency closure of gcc (rustc's linker),
# git, python (just's maintenance tests), cmake (ctest, which runs the checks), openssh,
# which, diffutils and procps-ng. Versions are those of the Portal build lock
# (fitzzz/portal 492299d63, services/builder/recipes/portal.lock), so this image moves
# with a set the service already builds; diffutils and which are not in that lock and take
# the versions on Fitz's workstation on 2026-11-06. Rust, zig, bun, node, just and
# cargo-nextest are not Arch packages here: the recipe's dockerfile lines install them at
# pinned versions with checked SHA-256 sums.
